[project]
name = "backend-harness-template"
version = "0.1.0"
description = "Reusable FastAPI backend harness with deterministic engineering gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "greenlet>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires isolated PostgreSQL and Redis services",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/db/session.py",
    "app/db/redis.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

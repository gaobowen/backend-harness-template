services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend_harness_test
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend_harness_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - backend_harness_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  backend_harness_postgres:
